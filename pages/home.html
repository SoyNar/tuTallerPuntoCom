<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home - TuTaller</title>
    <!-- Bootstrap CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!--Fuente de Bootstrap-->
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <!--Iconos de Bootstrap-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <!-- Estilos personalizados para pequeños detalles no soportados en Bootstrap -->
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="" />
    <link rel="stylesheet" href="../css/toast.css" />
  </head>
  <body>
    <main>
      <!--Sección ¿como funciona?-->
      <section class="py-4">
        <div class="container">
          <h2 class="fw-bold mb-4">¿Cómo funciona?</h2>
          <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-3">
            <div class="col">
              <div class="card h-100">
                <div class="card-body border border-3">
                  <span
                    class="d-inline-flex rounded-circle border p-3 fs-4 mb-3"
                    ><i class="bi bi-shield-check"></i
                  ></span>
                  <h3 class="card-title h6 fw-bold">Explora talleres</h3>
                  <p class="card-text small text-body-secondary mb-0">
                    Consulta el catálogo con servicios, ubicación y
                    calificación.
                  </p>
                </div>
              </div>
            </div>
            <div class="col">
              <div class="card h-100">
                <div class="card-body border border-3">
                  <span
                    class="d-inline-flex rounded-circle border p-3 fs-4 mb-3"
                    ><i class="bi bi-eye"></i
                  ></span>
                  <h3 class="card-title h6 fw-bold">Cotiza</h3>
                  <p class="card-text small text-body-secondary mb-0">
                    Consulta el precio aproximado del servicio que necesitas.
                  </p>
                </div>
              </div>
            </div>
            <div class="col">
              <div class="card h-100">
                <div class="card-body border border-3">
                  <span
                    class="d-inline-flex rounded-circle border p-3 fs-4 mb-3"
                    ><i class="bi bi-heart"></i
                  ></span>
                  <h3 class="card-title h6 fw-bold">Agenda tu cita</h3>
                  <p class="card-text small text-body-secondary mb-0">
                    Elige taller, servicio, fecha y hora
                  </p>
                </div>
              </div>
            </div>
            <div class="col">
              <div class="card h-100">
                <div class="card-body border border-3">
                  <span
                    class="d-inline-flex rounded-circle border p-3 fs-4 mb-3"
                    ><i class="bi bi-check2-circle"></i
                  ></span>
                  <h3 class="card-title h6 fw-bold">Haz seguimiento</h3>
                  <p class="card-text small text-body-secondary mb-0">
                    Revisa tus citas próximas y tu historial
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
