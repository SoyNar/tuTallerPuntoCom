<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | TuTaller</title>

  <!-- Usa los mismos <link> de Bootstrap y fuente que catalog.html -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

  <!-- <nav-bar></nav-bar> -->

  <main class="row g-0 min-vh-100">

    <auth-marca class="auth-marca col-lg-6 d-none d-lg-flex align-items-center justify-content-center
                       position-relative overflow-hidden text-white p-5"></auth-marca>

    <section class="col-lg-6 d-flex align-items-center justify-content-center p-4"
             aria-labelledby="auth-titulo">
      <div class="w-100 auth-ancho">

        <h1 id="auth-titulo" class="h3 fw-bold mb-1">¡Bienvenido!</h1>
        <p class="small text-secondary mb-4">Gestiona la atención de tu vehículo</p>

        <ul class="auth-tabs nav nav-pills nav-fill p-1 rounded-3 mb-4">
          <li class="nav-item">
            <a class="nav-link active small fw-bold" href="login.html" aria-current="page">Ingresar</a>
          </li>
          <li class="nav-item">
            <a class="nav-link small fw-bold" href="register.html">Registrarme</a>
          </li>
        </ul>

        <form id="formLogin" class="auth-form" novalidate>
          <div class="mb-3">
            <label for="correo" class="form-label small fw-semibold text-secondary">Correo electrónico</label>
            <input type="email" id="correo" name="correo" class="form-control rounded-3 py-2"
                   placeholder="ejemplo@correo.com" autocomplete="email" required>
            <div class="invalid-feedback">Escribe un correo válido.</div>
          </div>

          <div class="mb-3">
            <label for="clave" class="form-label small fw-semibold text-secondary">Contraseña</label>
            <input type="password" id="clave" name="clave" class="form-control rounded-3 py-2"
                   placeholder="••••••••" autocomplete="current-password" required>
            <div class="invalid-feedback">Escribe tu contraseña.</div>
          </div>

          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
            <div class="form-check mb-0">
              <input class="form-check-input" type="checkbox" id="recordar">
              <label class="form-check-label small fw-semibold" for="recordar">Mantener sesión iniciada</label>
            </div>
            <a href="recover-password.html" class="small fw-semibold text-decoration-none">¿Olvidaste tu contraseña?</a>
          </div>

          <button type="submit" class="btn btn-accent-custom w-100">Iniciar sesión</button>
        </form>

        <p class="text-center small text-secondary mt-4 mb-0">
          ¿No tienes cuenta?
          <a href="register.html" class="fw-semibold text-decoration-none">Regístrate</a>
        </p>

      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/views/authMarcha.js"></script>
</body>
</html>
