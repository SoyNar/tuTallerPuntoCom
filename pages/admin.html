<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Conoce el proyecto y el propósito detrás de TuTaller."
    />
    <title>Sobre nosotros · TuTaller</title>

    <!-- Orden igual en todas las páginas: Bootstrap, iconos, fuente, main, navbar, CSS de la página -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="../css/main.css" />
    
  </head>

  <body>
    <nav-bar></nav-bar>

    <main>
      <!-- ============ TÍTULO DE PÁGINA ============ -->
      <header class="page-header">
        <div class="container d-flex justify-content-between">
          <div>
            <h1>Administrar talleres</h1>
            <p>Gestiona los talleres que aparecen en la App.</p>
          </div>

          <div class="d-flex align-items-end pe-3">
            <button
              class="btn btn-lg btn-tt-accent px-4 rounded-3"
              data-bs-toggle="modal"
              data-bs-target="#modalTaller"
            >
              + Agregar taller
            </button>
            <!-- <a class="btn btn-lg btn-tt-accent px-4 rounded-3">+ Agregar taller</a> -->
          </div>
        </div>
      </header>

      <!-- ============ ESTADISTICAS ============ -->
      <section class="page-section">
        <div class="container">
          <div class="row gap-2">
            <div class="col">
              <div class="card" style="width: 18rem">
                <div class="card-body">
                  <div class="decorador-activos"></div>
                  <h3 class="card-titlec fw-bold">123</h3>
                  <h6 class="card-subtitle mb-2 text-muted">Activos</h6>
                </div>
              </div>
            </div>
            <div class="col">
              <div class="card" style="width: 18rem">
                <div class="card-body">
                  <div class="decorador-pendientes"></div>
                  <h3 class="card-titlec fw-bold">7</h3>
                  <h6 class="card-subtitle mb-2 text-muted">
                    Pendientes de verificar
                  </h6>
                </div>
              </div>
            </div>
            <div class="col">
              <div class="card" style="width: 18rem">
                <div class="card-body">
                  <div class="decorador-agenda"></div>
                  <h3 class="card-titlec fw-bold">342</h3>
                  <h6 class="card-subtitle mb-2 text-muted">Citas hoy</h6>
                </div>
              </div>
            </div>
            <div class="col">
              <div class="card" style="width: 18rem">
                <div class="card-body">
                  <div class="decorador-naranja"></div>
                  <h3 class="card-titlec fw-bold">3</h3>
                  <h6 class="card-subtitle mb-2 text-muted">Suspendidos</h6>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- ============ TALLERES ============ -->
      <section class="container p-4 bg-white">
        <!-- Filtrado -->
        <div class="row g-3 mb-4" id="filtros-talleres">
          <div class="col-12 col-md-6 col-lg-5">
            <div class="input-group">
              <span class="input-group-text border-end-0 text-secondary">
                <i class="bi bi-search"></i>
              </span>
              <input
                type="text"
                class="form-control border-start-0 ps-0"
                id="buscar-taller"
                data-filtro="texto"
                placeholder="Buscar taller o barrio"
              />
            </div>
          </div>
          <div class="col-12 col-md-4 col-lg-3">
            <select class="form-select" id="filtro-estado" data-filtro="estado">
              <option value="" selected>Todos los estados</option>
              <option value="activo">Activo</option>
              <option value="pendiente">Pendiente</option>
              <option value="suspendido">Suspendido</option>
            </select>
          </div>
        </div>

        <!-- Tabla de talleres -->
        <div class="table-responsive">
          <table
            class="table table-ligth table-hover align-middle border-bottom"
          >
            <thead class="table-header">
              <tr>
                <th scope="col" class="fw-semibold p-3 border-0 rounded-start">
                  Taller
                </th>
                <th scope="col" class="fw-semibold p-3 border-0">Ubicación</th>
                <th scope="col" class="fw-semibold p-3 border-0">Tipo</th>
                <th scope="col" class="fw-semibold p-3 border-0">Servicios</th>
                <th scope="col" class="fw-semibold p-3 border-0">Estado</th>
                <th
                  scope="col"
                  class="fw-semibold p-3 border-0 rounded-end"
                ></th>
              </tr>
            </thead>
            <tbody id="filas-tabla">
              <!--Filas generadas por admin.js-->
            </tbody>
          </table>
        </div>
        <div class="d-flex justify-content-between align-items-center mt-3">
  <small id="info-pagina" class="text-secondary"></small>
  <nav aria-label="Paginación de talleres" class="mt-4">
  <ul class="pagination mb-0" id="paginacion"></ul>
</nav>
</div>
      </section>
      <div id="modalContainer"></div>
    </main>

    <!-- ============ FOOTER ============ -->
    <tu-footer></tu-footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="../js/pages/admin.js"></script>
    <script type="module" src="../js/components.js"></script>
   
    <script type="module" src="../components/js/wizard.js"></script>
  </body>
</html>
