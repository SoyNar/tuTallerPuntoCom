<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar contraseña | TuTaller</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body>

  <nav-bar></nav-bar>

  <main class="row g-0 min-vh-100">

    <auth-marca class="auth-marca col-lg-6 d-none d-lg-flex align-items-center justify-content-center
                       position-relative overflow-hidden text-white p-5"></auth-marca>

    <section class="col-lg-6 d-flex align-items-center justify-content-center p-4"
             aria-labelledby="auth-titulo">
      <div class="w-100 auth-ancho">

        <!-- Icono de contexto -->
        <div class="auth-icono rounded-circle d-inline-flex align-items-center justify-content-center mb-3">
          <i class="bi bi-key fs-4"></i>
        </div>

        <h1 id="auth-titulo" class="h3 fw-bold mb-1">¿Olvidaste tu contraseña?</h1>
        <p class="small text-secondary mb-4">
          Escribe el correo de tu cuenta y te enviaremos un enlace para crear una nueva contraseña.
        </p>

        <form id="formRecuperar" class="auth-form" novalidate>
          <div class="mb-4">
            <label for="correo" class="form-label small fw-semibold text-secondary">Correo electrónico</label>
            <input type="email" id="correo" name="correo" class="form-control rounded-3 py-2"
                   placeholder="ejemplo@correo.com" autocomplete="email" required>
            <div class="invalid-feedback">Escribe un correo válido.</div>
          </div>

          <button type="submit" class="btn btn-accent-custom w-100">Enviar enlace</button>
        </form>

        <!-- Estado de éxito: oculto hasta que se envíe el formulario -->
        <div id="recuperarOk" class="alert alert-success rounded-3 mt-4 d-none" role="status">
          Si el correo está registrado, recibirás un enlace en unos minutos.
        </div>

        <p class="text-center small text-secondary mt-4 mb-0">
          ¿Recordaste tu contraseña?
          <a href="login.html" class="fw-semibold text-decoration-none">Volver a iniciar sesión</a>
        </p>

      </div>
    </section>

  </main>

  <script type="module" src="../js/views/authMarcha.js"></script>
  <script type="module" src="../js/components.js"></script>
  <!-- Cuando tengas la lógica, crea este archivo: -->
  <!-- <script type="module" src="../js/views/formulario-recuperar-validacion.js"></script> -->
</body>
</html>
