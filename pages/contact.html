<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Escríbenos y te responderemos lo antes posible."
    />
    <title>Contáctenos · TuTaller</title>

    <!-- Orden igual en todas las páginas: Bootstrap, iconos, fuente, main, navbar, CSS de la página -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/navbar.css" />
    <link rel="stylesheet" href="../css/footer.css" />
    <link rel="stylesheet" href="../css/toast.css" />
    <link rel="stylesheet" href="../css/contact.css" />

    <!-- Scripts propios de la página contacto -->
    <script type="module" src="../js/pages/contact.js"></script>
  </head>

  <body>
    <nav-bar></nav-bar>

    <main>
      <!-- ============ TÍTULO DE PÁGINA ============ -->
      <header class="page-header">
        <div class="container">
          <h1>Contáctanos</h1>
          <p>Escríbenos y te responderemos lo antes posible.</p>
        </div>
      </header>

      <!-- ============ CONTENIDO ============ -->
      <section class="page-section">
        <div class="container">
          <div class="row g-4">
            <!-- Columna de contactos -->
            <div class="columna-info col-12 col-lg-4">
              <div class="d-flex flex-column gap-3">
                <!-- Correo -->
                <div class="card border-0 shadow-sm rounded-4 p-3 bg-white">
                  <div class="d-flex align-items-center gap-3">
                    <div
                      class="rounded-circle bg-light p-3 d-flex align-items-center justify-content-center"
                      style="width: 50px; height: 50px"
                    >
                      <i class="bi bi-envelope fs-5"></i>
                    </div>
                    <div>
                      <small class="text-body-secondary d-block">Correo</small>
                      <strong>contacto@tutaller.com</strong>
                    </div>
                  </div>
                </div>

                <!-- Teléfono -->
                <div class="card border-0 shadow-sm rounded-4 p-3 bg-white">
                  <div class="d-flex align-items-center gap-3">
                    <div
                      class="rounded-circle bg-light p-3 d-flex align-items-center justify-content-center"
                      style="width: 50px; height: 50px"
                    >
                      <i class="bi bi-telephone fs-5"></i>
                    </div>
                    <div>
                      <small class="text-body-secondary d-block"
                        >Teléfono</small
                      >
                      <strong>+57 300 000 0000</strong>
                    </div>
                  </div>
                </div>

                <!-- WhatsApp -->
                <div class="card border-0 shadow-sm rounded-4 p-3 bg-white">
                  <div class="d-flex align-items-center gap-3">
                    <div
                      class="rounded-circle bg-light p-3 d-flex align-items-center justify-content-center"
                      style="width: 50px; height: 50px"
                    >
                      <i class="bi bi-whatsapp fs-5"></i>
                    </div>
                    <div>
                      <small class="text-body-secondary d-block"
                        >WhatsApp</small
                      >
                      <strong>+57 300 000 0000</strong>
                    </div>
                  </div>
                </div>

                <!-- Horario -->
                <div class="card border-0 shadow-sm rounded-4 p-3 bg-white">
                  <div class="d-flex align-items-center gap-3">
                    <div
                      class="rounded-circle bg-light p-3 d-flex align-items-center justify-content-center"
                      style="width: 50px; height: 50px"
                    >
                      <i class="bi bi-clock fs-5"></i>
                    </div>
                    <div>
                      <small class="text-body-secondary d-block">Horario</small>
                      <strong>Lunes a sábado, 8:00 am a 6:00 pm</strong>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Columna derecha - formulario -->
            <div class="columna-formulario col-12 col-lg-8">
              <div
                class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white"
              >
                <h2 class="fw-bold mb-4 h4">Envíanos un mensaje</h2>

                <form
                  id="form-contacto"
                  action="https://formspree.io/f/xnpjlvla"
                  method="POST"
                >
                  <div class="row g-3">
                    <!-- Nombre completo -->
                    <div class="col-12 col-md-6">
                      <label
                        for="campo-nombre"
                        class="form-label small fw-semibold text-secondary"
                        >Nombre completo</label
                      >
                      <input
                        type="text"
                        class="form-control py-2 rounded-3"
                        id="campo-nombre"
                        placeholder="Tu nombre"
                        name="nombre"
                      />
                    </div>

                    <!-- Correo electrónico -->
                    <div class="col-12 col-md-6">
                      <label
                        for="campo-email"
                        class="form-label small fw-semibold text-secondary"
                        >Correo electrónico</label
                      >
                      <input
                        type="email"
                        class="form-control py-2 rounded-3"
                        id="campo-email"
                        placeholder="ejemplo@correo.com"
                        name="email"
                      />
                    </div>

                    <!-- Asunto -->
                    <div class="col-12 col-md-6">
                      <label
                        for="campo-asunto"
                        class="form-label small fw-semibold text-secondary"
                        >Asunto</label
                      >
                      <select
                        class="form-select py-2 rounded-3 text-muted"
                        id="campo-asunto"
                        name="asunto"
                      >
                        <option selected disabled>Selecciona un asunto</option>
                        <option value="cotizacion">Cotización</option>
                        <option value="soporte">Soporte técnico</option>
                        <option value="otro">Otro</option>
                      </select>
                    </div>

                    <!-- Teléfono -->
                    <div class="col-12 col-md-6">
                      <label
                        for="campo-telefono"
                        class="form-label small fw-semibold text-secondary"
                        >Teléfono</label
                      >
                      <input
                        type="tel"
                        class="form-control py-2 rounded-3"
                        id="campo-telefono"
                        placeholder="+57 301 000 0000"
                        name="telefono"
                      />
                    </div>

                    <!-- Mensaje -->
                    <div class="col-12">
                      <label
                        for="campo-mensaje"
                        class="form-label small fw-semibold text-secondary"
                        >Mensaje</label
                      >
                      <textarea
                        class="form-control rounded-3"
                        id="campo-mensaje"
                        rows="4"
                        placeholder="Escribe tu mensaje..."
                        name="mensaje"
                      ></textarea>
                      <p class="text-body-secondary mt-2 mb-0">
                        <span id="caracteres" class="fw-bold">1000</span>
                        caracteres restantes.
                      </p>
                    </div>

                    <!-- Botón enviar -->
                    <div class="col-12 mt-4">
                      <button
                        type="submit"
                        class="btn text-white rounded-3 px-4 py-2 fw-semibold"
                      >
                        Enviar mensaje
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- ============ DÓNDE ESTAMOS ============ -->
      <section class="page-section pt-0">
        <div class="container seccion-mapa">
          <h2 class="fw-bold mb-4 h4">Dónde estamos</h2>
          <div
            class="card border border-primary-subtle bg-light rounded-4 p-5 text-center d-flex align-items-center justify-content-center"
            style="min-height: 250px"
          >
            <span class="text-body-secondary small"
              >Mapa de ubicación del taller</span
            >
          </div>
        </div>
      </section>
    </main>
    <tu-footer></tu-footer>

    <!-- Bootstrap JS Bundle (misma versión que las demás páginas) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../services/contact-service.js"></script>
    <script type="module" src="../components/navbar.js"></script>
    <script type="module" src="../components/footer.js"></script>
  </body>
</html>
