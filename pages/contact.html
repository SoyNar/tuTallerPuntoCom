<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contáctenos - TuTaller</title>
    <!-- Incluir Bootstrap CSS (puedes usar un CDN o archivo local) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Tu hoja de estilos personalizada vacía (para que tu equipo trabaje aquí) -->
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <!-- === SECCIÓN PRINCIPAL (Ancho Completo) === -->
    <div class="contenedor-pagina container-fluid px-0">
      <!-- Fila principal que divide la pantalla -->
      <div class="row g-0 align-items-stretch">
        <!-- === COLUMNA IZQUIERDA (Info/Imagen) === -->
        <!-- Esta columna tendrá el fondo azul en CSS -->
        <div
          class="columna-info col-md-6 col-lg-5 p-5 d-flex flex-column justify-content-center text-white"
        >
          <!-- Placeholder para el logo y nombre -->
          <div class="info-logo mb-5">
            <img
              src="ruta/al/logo.png"
              alt="Logo TuTaller"
              class="img-fluid"
              style="max-height: 40px"
            />
            <span class="info-nombre h4 ms-2">TuTaller</span>
          </div>

          <!-- Placeholder para la imagen de la bombilla -->
          <div class="info-imagen text-center mb-5">
            <img
              src="ruta/a/la/imagen-bombilla.png"
              alt="Icono de vehículo"
              class="img-fluid"
              style="max-width: 200px"
            />
          </div>

          <!-- Título y subtítulo -->
          <div class="info-texto mb-5">
            <h1 class="display-4 fw-bold">
              Tu vehículo,<br />
              en buenas manos.
            </h1>
            <p class="lead mt-3">
              ¡Estamos aquí para ayudarte! Ponte en contacto con nosotros.
            </p>
          </div>

          <!-- Lista de beneficios (Placeholders) -->
          <ul class="info-lista list-unstyled text-start">
            <li class="mb-3 d-flex align-items-center">
              <span
                class="punto-lista bg-danger rounded-circle me-3"
                style="width: 15px; height: 15px"
              ></span>
              Asistencia rápida y confiable.
            </li>
            <li class="mb-3 d-flex align-items-center">
              <span
                class="punto-lista bg-danger rounded-circle me-3"
                style="width: 15px; height: 15px"
              ></span>
              Precios competitivos.
            </li>
            <li class="mb-3 d-flex align-items-center">
              <span
                class="punto-lista bg-danger rounded-circle me-3"
                style="width: 15px; height: 15px"
              ></span>
              Atención personalizada.
            </li>
          </ul>
        </div>

        <!-- === COLUMNA DERECHA (Formulario de Contacto) === -->
        <!-- Esta columna tendrá el fondo claro en CSS -->
        <div
          class="columna-formulario col-md-6 col-lg-7 p-5 d-flex flex-column justify-content-center bg-light"
        >
          <!-- Cabecera del Formulario -->
          <div class="formulario-cabecera mb-5 text-start">
            <h2 class="fw-bold text-primary">¡Contáctanos!</h2>
            <p class="text-muted">
              Déjanos tu mensaje y nos comunicaremos pronto.
            </p>
          </div>

          <!-- Formulario -->
          <form id="form-contacto" class="needs-validation" novalidate>
            <!-- Campo: Nombre Completo -->
            <div class="form-grupo mb-4">
              <label for="campo-nombre" class="form-label text-dark fw-bold"
                >Nombre Completo</label
              >
              <input
                type="text"
                class="form-control"
                id="campo-nombre"
                name="nombre"
                placeholder="Tu nombre"
                required
              />
            </div>

            <!-- Campo: Correo Electrónico -->
            <div class="form-grupo mb-4">
              <label for="campo-email" class="form-label text-dark fw-bold"
                >Correo Electrónico</label
              >
              <input
                type="email"
                class="form-control"
                id="campo-email"
                name="email"
                placeholder="correo@ejemplo.com"
                required
              />
            </div>

            <!-- Campo: Teléfono -->
            <div class="form-grupo mb-4">
              <label for="campo-telefono" class="form-label text-dark fw-bold"
                >Teléfono (opcional)</label
              >
              <input
                type="tel"
                class="form-control"
                id="campo-telefono"
                name="telefono"
                placeholder="Número de contacto"
              />
            </div>

            <!-- Campo: Mensaje (TextArea) -->
            <div class="form-grupo mb-4">
              <label for="campo-mensaje" class="form-label text-dark fw-bold"
                >Tu Mensaje</label
              >
              <textarea
                class="form-control"
                id="campo-mensaje"
                name="mensaje"
                rows="4"
                placeholder="Escribe aquí tu consulta..."
                required
              ></textarea>
            </div>

            <!-- Botón de Envío -->
            <div class="form-grupo-boton text-start">
              <button
                type="submit"
                class="btn btn-warning btn-lg text-white w-100"
              >
                Enviar Mensaje
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Incluir Bootstrap JS (necesario para validaciones y componentes interactivos si se añaden) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Tu archivo JS personalizado (para validaciones de tu equipo) -->
    <script src="script.js"></script>
  </body>
</html>
