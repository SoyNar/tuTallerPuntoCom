<h2 class="wizard-titulo">1. Datos del taller</h2>
<p class="wizard-subtitulo">Información básica y de contacto.</p>

<div class="mb-3">
  <label for="tallerNombre" class="form-label fw-bold small">Nombre del taller</label>
  <input type="text" id="tallerNombre" name="nombre"
         class="form-control wizard-input" placeholder="Ej: Taller El Pistón" required>
</div>

<div class="row mb-3">
  <div class="col-md-6 mb-3 mb-md-0">
    <label for="tallerNit" class="form-label fw-bold small">NIT o RUT</label>
    <input type="text" id="tallerNit" name="nit"
           class="form-control wizard-input" placeholder="900.123.456-7" required>
  </div>
  <div class="col-md-6">
    <label for="tallerTelefono" class="form-label fw-bold small">Teléfono / WhatsApp</label>
    <input type="tel" id="tallerTelefono" name="telefono"
           class="form-control wizard-input" placeholder="300 123 4567" required>
  </div>
</div>

<div class="mb-3">
  <label for="tallerCorreo" class="form-label fw-bold small">Correo</label>
  <input type="email" id="tallerCorreo" name="correo"
         class="form-control wizard-input" placeholder="contacto@taller.com" required>
</div>

<div class="mb-3">
  <label class="form-label fw-bold small d-block">Tipo de vehículos</label>

  <input type="radio" class="btn-check" name="tipoVehiculos" id="vehCarros" value="carros" checked>
  <label class="wizard-chip" for="vehCarros">Carros</label>

  <input type="radio" class="btn-check" name="tipoVehiculos" id="vehMotos" value="motos">
  <label class="wizard-chip" for="vehMotos">Motos</label>

  <input type="radio" class="btn-check" name="tipoVehiculos" id="vehAmbos" value="ambos">
  <label class="wizard-chip" for="vehAmbos">Ambos</label>
</div>
