<h2 class="wizard-titulo">4. Fotos y estado</h2>
<p class="wizard-subtitulo">Una foto de portada y el estado de verificación.</p>

<!-- Zona de carga -->
<label for="tallerFotos" class="wizard-upload mb-4">
    <img id="fotoMiniatura" class="wizard-upload-img d-none" alt="Portada elegida">
  <div class="fs-4 mb-2" id="fotoIcono">🖼️</div>
  <p class="mb-1 small">Arrastra fotos aquí o <span class="text-primary fw-semibold">toca para subirlas</span></p>
  <span class="text-muted wizard-upload-nota">JPG o PNG, máximo 5 MB</span>
  <input type="file" id="tallerFotos" name="fotos" class="d-none"
         accept="image/png, image/jpeg" >
</label>

<!-- Estado -->
<div class="mb-3" id="estadoTaller" role="group" aria-label="Estado actual taller">
  
</div>
